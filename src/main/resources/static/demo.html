<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camorix 낙상 감지 데모</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172426;
            --muted: #647174;
            --line: #dce5e3;
            --paper: #ffffff;
            --canvas: #f3f7f6;
            --brand: #087f73;
            --brand-dark: #065f57;
            --normal: #16866f;
            --caution: #c17b0b;
            --danger: #d4512d;
            --fall: #bd2435;
            --shadow: 0 12px 34px rgba(29, 54, 54, .08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            background:
                radial-gradient(circle at 92% 0, rgba(8, 127, 115, .13), transparent 32rem),
                var(--canvas);
            color: var(--ink);
            font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
        }

        button, select { font: inherit; }

        .shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 36px 0 56px;
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 26px;
        }

        h1 {
            margin: 4px 0 8px;
            font-size: clamp(28px, 4vw, 42px);
            letter-spacing: -.04em;
        }

        .eyebrow {
            margin: 0;
            color: var(--brand);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .12em;
        }

        .subtitle { margin: 0; color: var(--muted); line-height: 1.6; }

        .connection {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            padding: 10px 13px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, .84);
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .connection::before {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #9ba8a6;
            content: "";
        }

        .connection.online::before {
            background: #28a98f;
            box-shadow: 0 0 0 4px rgba(40, 169, 143, .14);
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(300px, .8fr);
            gap: 20px;
        }

        .card {
            border: 1px solid rgba(211, 224, 221, .95);
            border-radius: 20px;
            background: rgba(255, 255, 255, .93);
            box-shadow: var(--shadow);
        }

        .main-card { padding: 24px; }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        h2 { margin: 0; font-size: 20px; letter-spacing: -.025em; }

        .room-select {
            padding: 9px 34px 9px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--paper);
            color: var(--ink);
            font-weight: 700;
        }

        .camera {
            position: relative;
            display: grid;
            min-height: 350px;
            place-items: center;
            overflow: hidden;
            border-radius: 16px;
            background:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
                #172d30;
            background-size: 32px 32px;
        }

        .camera::after {
            position: absolute;
            inset: 10%;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 50%;
            content: "";
        }

        .camera-label {
            position: absolute;
            z-index: 2;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,.72);
            font-size: 12px;
            font-weight: 800;
        }

        .camera-label::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f0505d;
            content: "";
        }

        .room-scene {
            position: relative;
            z-index: 1;
            width: 78%;
            height: 72%;
            border: 2px solid rgba(210, 238, 234, .24);
            border-radius: 48%;
            transform: perspective(500px) rotateX(8deg);
        }

        .bed {
            position: absolute;
            width: 34%;
            height: 26%;
            border: 2px solid rgba(255,255,255,.68);
            border-radius: 10px;
            color: rgba(255,255,255,.8);
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            padding-top: 9%;
        }

        .bed:first-child { left: 11%; top: 20%; }
        .bed:nth-child(2) { right: 11%; bottom: 20%; }

        .person {
            position: absolute;
            left: 37%;
            top: 42%;
            width: 18%;
            height: 34%;
            border: 3px solid #54d6be;
            border-radius: 50% 50% 38% 38%;
            box-shadow: 0 0 24px rgba(84, 214, 190, .25);
            transition: .35s ease;
        }

        .person::before {
            position: absolute;
            top: -19px;
            left: calc(50% - 9px);
            width: 18px;
            height: 18px;
            border: 3px solid currentColor;
            border-radius: 50%;
            content: "";
        }

        .camera[data-severity="CAUTION"] .person { border-color: #e9ac3c; color: #e9ac3c; }
        .camera[data-severity="DANGER"] .person { border-color: #f47752; color: #f47752; }
        .camera[data-severity="FALL"] .person {
            top: 60%;
            width: 32%;
            height: 13%;
            border-color: #f0505d;
            border-radius: 45%;
            color: #f0505d;
            transform: rotate(12deg);
        }

        .severity-chip {
            position: absolute;
            z-index: 3;
            right: 16px;
            bottom: 16px;
            min-width: 90px;
            padding: 9px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,.92);
            color: var(--normal);
            font-size: 12px;
            font-weight: 900;
            text-align: center;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        .scenario {
            padding: 12px 8px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--paper);
            color: var(--ink);
            cursor: pointer;
            font-weight: 800;
            transition: .18s ease;
        }

        .scenario:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(35, 61, 59, .09); }
        .scenario[data-level="NORMAL"] { color: var(--normal); }
        .scenario[data-level="CAUTION"] { color: var(--caution); }
        .scenario[data-level="DANGER"] { color: var(--danger); }
        .scenario[data-level="FALL"] { color: var(--fall); }

        .side { display: grid; gap: 20px; align-content: start; }
        .side .card { padding: 20px; }

        .patient-list, .event-list {
            display: grid;
            gap: 10px;
            margin-top: 16px;
        }

        .patient, .event {
            display: grid;
            gap: 3px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fbfdfc;
        }

        .patient-top, .event-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            font-weight: 800;
        }

        .meta { color: var(--muted); font-size: 12px; }
        .level { font-size: 11px; font-weight: 900; }
        .level.NORMAL { color: var(--normal); }
        .level.CAUTION { color: var(--caution); }
        .level.DANGER { color: var(--danger); }
        .level.FALL { color: var(--fall); }

        .events {
            grid-column: 1 / -1;
            padding: 24px;
        }

        .event-list {
            grid-template-columns: repeat(3, 1fr);
            max-height: 250px;
            overflow: auto;
        }

        .empty { color: var(--muted); font-size: 13px; }

        .notice {
            margin-top: 16px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 20;
            max-width: min(360px, calc(100% - 48px));
            padding: 15px 17px;
            border-radius: 13px;
            background: #172426;
            box-shadow: 0 16px 36px rgba(12, 29, 30, .24);
            color: white;
            font-size: 14px;
            font-weight: 750;
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
            transition: .22s ease;
        }

        .toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 850px) {
            header { display: grid; }
            .grid { grid-template-columns: 1fr; }
            .events { grid-column: auto; }
            .event-list { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 540px) {
            .shell { width: min(100% - 20px, 1180px); padding-top: 20px; }
            .main-card, .events { padding: 16px; }
            .section-head { align-items: stretch; flex-direction: column; }
            .camera { min-height: 280px; }
            .controls { grid-template-columns: 1fr 1fr; }
            .event-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main class="shell">
    <header>
        <div>
            <p class="eyebrow">CAMORIX · LOCAL DEMO</p>
            <h1>병실 낙상 감지 모니터</h1>
            <p class="subtitle">임시 환자 데이터와 가상 카메라 프레임으로 알림 흐름을 테스트합니다.</p>
        </div>
        <div id="connection" class="connection">SSE 연결 중</div>
    </header>

    <div class="grid">
        <section class="card main-card">
            <div class="section-head">
                <h2>실시간 병실 화면</h2>
                <select id="roomSelect" class="room-select" aria-label="병실 선택"></select>
            </div>
            <div id="camera" class="camera" data-severity="NORMAL">
                <span class="camera-label">FISHEYE CAMERA · SIMULATION</span>
                <div class="room-scene">
                    <div class="bed">BED-1</div>
                    <div class="bed">BED-2</div>
                    <div class="person" aria-hidden="true"></div>
                </div>
                <div id="severityChip" class="severity-chip">정상 · NORMAL</div>
            </div>
            <div class="controls" aria-label="상황 시뮬레이션">
                <button class="scenario" data-level="NORMAL">정상 자세</button>
                <button class="scenario" data-level="CAUTION">주의 자세</button>
                <button class="scenario" data-level="DANGER">위험 감지</button>
                <button class="scenario" data-level="FALL">낙상 감지</button>
            </div>
        </section>

        <aside class="side">
            <section class="card">
                <h2>현재 환자</h2>
                <div id="patientList" class="patient-list"><span class="empty">불러오는 중…</span></div>
                <p class="notice">표시되는 모든 개인정보는 테스트용 가상 데이터입니다.</p>
            </section>
        </aside>

        <section class="card events">
            <div class="section-head">
                <h2>최근 위험 이벤트</h2>
                <span id="eventCount" class="meta">0건</span>
            </div>
            <div id="eventList" class="event-list"><span class="empty">불러오는 중…</span></div>
        </section>
    </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
    const state = {
        patients: [],
        counters: {},
        labels: { NORMAL: "정상", CAUTION: "주의", DANGER: "위험", FALL: "낙상" }
    };

    const roomSelect = document.querySelector("#roomSelect");
    const patientList = document.querySelector("#patientList");
    const eventList = document.querySelector("#eventList");
    const eventCount = document.querySelector("#eventCount");
    const camera = document.querySelector("#camera");
    const severityChip = document.querySelector("#severityChip");
    const connection = document.querySelector("#connection");
    const toast = document.querySelector("#toast");
    let toastTimer;

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
    }

    function formatDate(value) {
        if (!value) return "-";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : new Intl.DateTimeFormat("ko-KR", {
            month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit"
        }).format(date);
    }

    function localTimestamp() {
        const date = new Date();
        const pad = value => String(value).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
            `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    async function loadPatients() {
        const response = await fetch("/patient");
        if (!response.ok) throw new Error("환자 데이터를 불러오지 못했습니다.");
        state.patients = await response.json();

        const rooms = [...new Set(state.patients.map(patient => patient.roomNumber))].sort();
        roomSelect.innerHTML = rooms.map(room =>
            `<option value="${escapeHtml(room)}">${escapeHtml(room)}호</option>`
        ).join("");

        rooms.forEach(room => state.counters[room] = { fall: 0, danger: 0 });
        renderPatients();
    }

    function renderPatients() {
        const room = roomSelect.value;
        const patients = state.patients.filter(patient => patient.roomNumber === room);
        patientList.innerHTML = patients.length ? patients.map(patient => `
            <article class="patient">
                <div class="patient-top">
                    <span>${escapeHtml(patient.name)}</span>
                    <span>${escapeHtml(patient.bedId)}</span>
                </div>
                <span class="meta">${escapeHtml(patient.gender)} · ${escapeHtml(patient.birthdate)}</span>
            </article>
        `).join("") : `<span class="empty">이 병실의 환자가 없습니다.</span>`;
    }

    async function loadEvents() {
        const response = await fetch("/realtime/event");
        if (!response.ok) throw new Error("이벤트 이력을 불러오지 못했습니다.");
        const events = await response.json();
        eventCount.textContent = `${events.length}건`;
        eventList.innerHTML = events.length ? events.slice(0, 12).map(event => `
            <article class="event">
                <div class="event-top">
                    <span>${escapeHtml(event.roomNumber)}호</span>
                    <span class="level ${escapeHtml(event.severity)}">${escapeHtml(event.severity)}</span>
                </div>
                <span class="meta">${escapeHtml(formatDate(event.occurredAt))}</span>
                <span class="meta">${event.success ? "알림 전송됨" : "감지됨 · 구독자 없음"}</span>
            </article>
        `).join("") : `<span class="empty">저장된 이벤트가 없습니다.</span>`;
    }

    function buildFrame(level) {
        const room = roomSelect.value;
        const counts = state.counters[room];
        if (level === "DANGER") counts.danger += 1;
        if (level === "FALL") counts.fall += 1;

        const pose = level === "FALL" ? "LYING" : level === "CAUTION" ? "BOW" : "STAND";
        return {
            capturedAt: localTimestamp(),
            width: 1280,
            height: 720,
            maxSeverity: level,
            roomNumber: room,
            fallCount: counts.fall,
            dangerCount: counts.danger,
            personList: [{
                severity: level,
                poseType: pose,
                centerX: 640,
                centerY: level === "FALL" ? 550 : 380,
                width: level === "FALL" ? 280 : 110,
                height: level === "FALL" ? 90 : 260
            }],
            itemList: [{
                itemType: "BED",
                centerX: 330,
                centerY: 260,
                width: 360,
                height: 190,
                horz: "LEFT",
                identifier: "BED-1"
            }]
        };
    }

    async function simulate(level) {
        const frame = buildFrame(level);
        const response = await fetch("/realtime/frame", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(frame)
        });
        if (!response.ok) throw new Error(`프레임 전송 실패 (${response.status})`);
        updateScene(level);
        showToast(`${frame.roomNumber}호 ${state.labels[level]} 프레임을 전송했습니다.`);
        if (level === "DANGER" || level === "FALL") {
            setTimeout(loadEvents, 250);
        }
    }

    function updateScene(level) {
        camera.dataset.severity = level;
        severityChip.textContent = `${state.labels[level]} · ${level}`;
        severityChip.style.color = `var(--${level.toLowerCase()})`;
    }

    function connectSse() {
        const notify = new EventSource("/realtime/stream/notify?tabId=demo-dashboard");
        const realtime = new EventSource("/realtime/stream/realtime?tabId=demo-dashboard");

        let opened = 0;
        const markOpen = () => {
            opened += 1;
            if (opened >= 2) {
                connection.textContent = "실시간 연결됨";
                connection.classList.add("online");
            }
        };

        notify.onopen = markOpen;
        realtime.onopen = markOpen;
        notify.addEventListener("notification", event => {
            const data = JSON.parse(event.data);
            showToast(`⚠ ${data.roomNumber}호 ${state.labels[data.severity] ?? data.severity} 알림`);
            loadEvents();
        });
        realtime.addEventListener("frame", event => {
            const data = JSON.parse(event.data);
            if (data.roomNumber === roomSelect.value) updateScene(data.maxSeverity);
        });
        const markError = () => {
            connection.textContent = "연결 재시도 중";
            connection.classList.remove("online");
            opened = 0;
        };
        notify.onerror = markError;
        realtime.onerror = markError;
    }

    roomSelect.addEventListener("change", () => {
        renderPatients();
        updateScene("NORMAL");
    });

    document.querySelectorAll(".scenario").forEach(button => {
        button.addEventListener("click", () => {
            simulate(button.dataset.level).catch(error => showToast(error.message));
        });
    });

    Promise.all([loadPatients(), loadEvents()])
        .then(connectSse)
        .catch(error => showToast(error.message));
</script>
</body>
</html>
