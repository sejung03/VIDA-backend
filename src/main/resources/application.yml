spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change-me}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        show_sql: false
        format_sql: true
    hibernate:
      ddl-auto: create-drop

  security:
    oauth2:
      client:
        registration:
          naver-user:
            provider: naver
            client-name: naver-user
            client-id: ${NAVER_CLIENT_ID:change-me}
            client-secret: ${NAVER_CLIENT_SECRET:change-me}
            redirect-uri: http://localhost:8080/login/oauth2/code/naver-user
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
          naver-nurse:
            provider: naver
            client-name: naver-nurse
            client-id: ${NAVER_CLIENT_ID:change-me}
            client-secret: ${NAVER_CLIENT_SECRET:change-me}
            redirect-uri: http://localhost:8080/login/oauth2/code/naver-nurse
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
          google-user:
            provider: google
            client-name: google-user
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            redirect-uri: http://localhost:8080/login/oauth2/code/google-user
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
          google-nurse:
            provider: google
            client-name: google-nurse
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            redirect-uri: http://localhost:8080/login/oauth2/code/google-nurse
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
          kakao-user:
            provider: kakao
            client-name: kakao-user
            client-id: ${KAKAO_CLIENT_ID:change-me}
            client-secret: ${KAKAO_CLIENT_SECRET:change-me}
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao-user
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          kakao-nurse:
            provider: kakao
            client-name: kakao-nurse
            client-id: ${KAKAO_CLIENT_ID:change-me}
            client-secret: ${KAKAO_CLIENT_SECRET:change-me}
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao-nurse
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET:change-this-secret-before-production-use-1234567890}
